  entitlement rather than an API limit: the help center documents an "active rule
  limit" on workflows that customers must contact Rattle to raise
  (https://help.gorattle.com/en/articles/6060531-i-reached-the-active-rule-limit-how-can-i-increase-it),
  with no number given. Recorded as an honest zero after searching the full help-center
  index at https://help.gorattle.com/llms.txt and probing every Rattle/Von host for an
  API contract on 2026-08-13.
