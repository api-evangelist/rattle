note: >-
  Rattle publishes dated product release notes as a "Weekly release notes" collection
  in its Intercom help center. There is no semantic version, no API version, and no
  RSS/Atom feed of releases beyond the help-center feed; the collection is discoverable
  through https://help.gorattle.com/llms.txt. Publication has been irregular — the most
  recent entry indexed on 2026-08-13 is dated 2025-06-28. The Von brand
  (https://vonlabs.ai) publishes no changelog of its own; four Von onboarding articles
  were added to the same Rattle help center in December 2025.
