    customer's own Salesforce tenant — api.gorattle.com does not resolve at all, and
    api.vonlabs.ai answers as a bare nginx origin that 404s /openapi.json,
    /swagger.json, /docs, /redoc, /api-docs, /mcp and every /.well-known path, so there
    is no developer portal, API reference, SDK, webhook catalog or machine-readable
    contract anywhere on either brand.
