description: >-
  Rattle is a sales-execution platform that positions itself as "the AI layer your
  CRM always needed," connecting Salesforce and Slack so revenue teams can automate
  RevOps workflows, keep CRM data accurate, and surface deal insights in real time.
  AI agents drive alerts, data validation, deal-risk assessment, and meeting
  intelligence from inside Slack. Rattle is backed by GV (Google Ventures). As of
  this enrichment pass Rattle exposes no public developer API, SDKs, or API
  reference; this profile captures the company's public web, security/compliance,
  and operational-transparency surface.
