name: Rattle
description: >-
  Rattle is a sales-execution and revenue-workflow platform that positions itself as
  "the AI layer your CRM always needed," connecting Salesforce with Slack and Microsoft
  Teams so revenue teams can automate RevOps workflows, keep CRM data accurate, and
  surface deal insights in real time. AI features — Wizard, Smart Context, Meeting
  Intelligence, Deal Rooms, Board and Leaderboard — drive alerts, field auto-update,
  deal-risk assessment and call summarization from inside the chat client. In May 2026
  the company rebranded its forward product to Von (vonlabs.ai), an "AI RevOps
  teammate" that connects to CRM, call recordings and the data warehouse; Rattle
  remains fully supported for existing customers. Rattle is backed by GV (Google
  Ventures), Insight Partners, Sequoia and Lightspeed. As of this enrichment pass
  neither Rattle nor Von exposes a public developer API, SDK, webhook catalog or API
  reference — probes of api.gorattle.com, api.vonlabs.ai and every documented host
  returned no machine-readable contract — so this profile captures the company's
  public web, help-center, release-note, security/compliance and
  operational-transparency surface.
